name: Validate Code

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  validate-code:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'

      - name: Install node dependencies
        run: pnpm ci-install

      - name: Run code dupe
        run: pnpm ci-dupe-code

      - name: Run code unused
        run: pnpm ci-unused-code

      - name: Run lint
        run: pnpm ci-lint

      - name: Run tests
        run: pnpm ci-test
